<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{color-scheme:dark;font-family:var(--font-sans,Geist,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);background:#000;color:#f7f7f7;--line:#3b3b3b;--muted:#a1a1a1;--panel:#090909;--blue:#0a84ff;--green:#30d158;--red:#ff453a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{height:min(820px,92vh);min-height:620px;display:grid;grid-template-rows:auto auto 1fr;background:#000;border:1px solid #fff;border-radius:20px;overflow:hidden;transition:opacity .12s ease}.topbar{min-height:72px;display:flex;align-items:center;gap:18px;padding:14px 18px;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:700;letter-spacing:-.04em}.live-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #0a84ff26}.task-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-state{margin-left:auto;color:var(--muted);font-size:13px;text-transform:capitalize}.controls{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto}.control,.task-select{min-height:40px;border:1px solid #fff;border-radius:12px;background:#050505;color:#fff;padding:0 13px}.task-select{min-width:260px;max-width:460px}.metrics{display:flex;gap:8px;margin-left:auto}.metric{padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:#d5d5d5;font-size:12px;white-space:nowrap}.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}.canvas-wrap{min-width:0;position:relative;overflow:hidden;border-right:1px solid var(--line);background-color:#030303;background-image:radial-gradient(#343434 1px,transparent 1px);background-size:22px 22px}.canvas-head{position:absolute;z-index:4;top:16px;left:18px}.eyebrow{color:#8d8d8d;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.canvas-title{margin-top:5px;font-size:21px;font-weight:700}.canvas{position:absolute;inset:74px 16px 18px;overflow:auto}.node-layer{position:relative;min-width:760px;min-height:500px}.node{position:absolute;width:220px;min-height:112px;padding:15px;border:1px solid #fff;border-radius:20px;background:#090909;box-shadow:0 12px 38px #0009;touch-action:none;user-select:none;will-change:transform;transition:box-shadow .16s ease,background .16s ease}.node:hover{background:#101010;box-shadow:0 16px 46px #000}.node.dragging{transition:none;cursor:grabbing;box-shadow:0 22px 60px #000}.node::before{content:"";position:absolute;inset:-3px;border:2px solid #777;border-radius:22px;pointer-events:none}.node[data-status="working"]::before,.node[data-status="testing"]::before{border-color:var(--blue);box-shadow:0 0 16px #0a84ff66}.node[data-status="settled"]::before{border-color:var(--green);box-shadow:0 0 13px #30d15838}.node[data-status="failed"]::before,.node[data-status="blocked"]::before{border-color:var(--red);box-shadow:0 0 13px #ff453a45}.node-kind{font-size:10px;color:#a5a5a5;text-transform:uppercase;letter-spacing:.11em}.node-title{font-size:16px;font-weight:700;margin:8px 0 5px}.node-role{font-size:12px;color:#b5b5b5;line-height:1.45}.node-status{display:inline-flex;margin-top:12px;padding:4px 8px;border:1px solid #555;border-radius:999px;font-size:10px;text-transform:capitalize}.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}.edge{stroke:#e5e5e5;stroke-width:1.5;fill:none;opacity:.75}.edge-label{fill:#bdbdbd;font-size:10px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:#a1a1a1}.empty strong{display:block;color:#fff;font-size:17px;margin-bottom:6px}.rail{min-width:0;display:grid;grid-template-rows:auto auto 1fr;background:#030303}.section{padding:16px;border-bottom:1px solid var(--line)}.section-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.count{color:#888;font-weight:500}.agent-list{display:grid;gap:9px;margin-top:12px;max-height:170px;overflow:auto}.agent{border:1px solid #fff;border-radius:14px;padding:11px;background:#080808}.agent-name{font-size:13px;font-weight:700}.agent-activity{margin-top:4px;color:#aaa;font-size:11px;line-height:1.4}.event-section{min-height:0;display:flex;flex-direction:column}.events{min-height:0;margin-top:10px;overflow:auto}.event{display:grid;grid-template-columns:8px 1fr;gap:9px;padding:10px 0;border-bottom:1px solid #292929}.event-mark{width:7px;height:7px;margin-top:5px;border-radius:50%;background:#777}.event-label{font-size:12px;line-height:1.4}.event-meta{margin-top:3px;color:#818181;font-size:10px}.message-trigger{position:absolute;z-index:7;left:18px;bottom:18px;min-height:46px;border:1px solid #fff;border-radius:15px;background:#fff;color:#000;padding:0 17px;font-weight:700;box-shadow:0 10px 30px #000}.dock{position:absolute;z-index:8;left:18px;bottom:18px;width:min(430px,calc(100% - 36px));border:1px solid #fff;border-radius:20px;background:#080808;box-shadow:0 22px 80px #000;overflow:hidden}.dock[hidden]{display:none}.dock-head{display:flex;align-items:center;padding:14px 15px;border-bottom:1px solid var(--line);font-weight:700}.close{margin-left:auto;border:0;background:transparent;color:#fff;font-size:22px}.conversation{height:190px;overflow:auto;padding:12px 15px;display:grid;gap:9px}.message{max-width:88%;padding:9px 11px;border:1px solid #4b4b4b;border-radius:14px;font-size:12px;line-height:1.45;white-space:pre-wrap}.message.user{justify-self:end;background:#fff;color:#000}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer textarea{min-height:50px;max-height:130px;resize:vertical;flex:1;border:1px solid #fff;border-radius:13px;background:#000;color:#fff;padding:11px}.send{width:50px;border:1px solid #fff;border-radius:13px;background:#fff;color:#000;font-size:18px}.toast{position:absolute;z-index:10;right:20px;bottom:20px;max-width:340px;padding:11px 14px;border:1px solid #fff;border-radius:12px;background:#111;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}html[data-display-mode="starting"] .app{opacity:0}html[data-display-mode="pip"] .app{height:100dvh;min-height:0;border:0;border-radius:0}html[data-display-mode="pip"] .workspace{grid-template-columns:minmax(0,1fr) clamp(240px,36vw,320px)}html[data-display-mode="pip"] .task-select{min-width:180px;max-width:320px}html[data-display-mode="pip"] .metrics{display:none}@media(max-width:850px){.app{height:900px}.workspace{grid-template-columns:1fr}.canvas-wrap{border-right:0;border-bottom:1px solid var(--line);min-height:560px}.rail{grid-template-columns:1fr 1fr;grid-template-rows:auto}.event-section{grid-column:1/-1;height:270px}.metrics{display:none}html[data-display-mode="pip"] .app{height:100dvh}html[data-display-mode="pip"] .workspace{grid-template-columns:minmax(0,1fr) minmax(220px,38vw)}html[data-display-mode="pip"] .canvas-wrap{min-height:0;border-right:1px solid var(--line);border-bottom:0}html[data-display-mode="pip"] .rail{display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr}html[data-display-mode="pip"] .event-section{grid-column:auto;height:auto}}@media(max-width:560px){html[data-display-mode="pip"] .workspace{grid-template-columns:1fr}html[data-display-mode="pip"] .canvas-wrap{min-height:58dvh;border-right:0;border-bottom:1px solid var(--line)}html[data-display-mode="pip"] .rail{min-height:42dvh}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
    .control{flex-shrink:0;white-space:nowrap}.control:disabled{opacity:.45;cursor:default}#canvas-size{position:relative;overflow:hidden}.node-layer{min-width:0;min-height:0;transform-origin:top left}
    /* The host can give an embedded MCP panel any viewport height. Fill that
       viewport so the workspace is never clipped by a fixed document height. */
    html,body{width:100%;height:100%;min-height:100dvh;overflow:hidden}
    .app{width:100%;height:100dvh;min-height:0;max-height:100dvh;grid-template-rows:auto auto minmax(0,1fr)}
    .workspace{height:100%;min-height:0;overflow:hidden;grid-template-rows:minmax(0,1fr)}
    .canvas-wrap,.rail{height:100%;min-height:0}
    .rail{overflow:hidden;grid-template-rows:auto auto minmax(0,1fr)}
    @media(max-width:850px){.app{height:100dvh;max-height:100dvh}.canvas-wrap{min-height:0}.event-section{height:auto}}
    @media(max-width:560px){html[data-display-mode="pip"] .workspace{grid-template-columns:minmax(0,1fr) minmax(220px,38vw)}html[data-display-mode="pip"] .canvas-wrap{height:100%;min-height:0;border-right:1px solid var(--line);border-bottom:0}html[data-display-mode="pip"] .rail{height:100%;min-height:0}}
  </style>
  <style>
    .layout-warning{max-width:26rem;margin-top:.6rem;padding:.45rem .6rem;color:#e4c784;background:#171208;border:1px solid #604c25;border-radius:8px;font-size:11px;font-weight:500}
    .node{height:132px;overflow:hidden}
    .node[data-container="true"]{z-index:1;background:#090909cc;border-color:#505866}
    .node[data-container="false"]{z-index:2}
    .node[data-unmapped="true"]::before{border-style:dashed;border-color:#b08b48;box-shadow:none}
    .node[data-selected="true"]{background:#121820;box-shadow:0 0 0 3px #8eb7ff66,0 18px 50px #000}
    .node[data-pinned="true"] .node-kind::after{content:" · pinned";color:#c3d6f7}
    .node-title{display:flex;align-items:center;gap:7px;min-width:0}
    .node-children{margin-top:8px;color:#fff;font-size:10px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .node-title:not(:has(.node-toggle)){padding-left:0}
    .node-toggle,.node-unpin{position:relative;z-index:3;display:inline-grid;place-items:center;flex:0 0 auto;border:1px solid #505050;background:#111;color:#ddd}
    .node-toggle{width:22px;height:22px;border-radius:7px;font-size:14px}
    .node-unpin{margin-left:auto;min-height:22px;padding:0 7px;border-radius:999px;font-size:9px;text-transform:uppercase;letter-spacing:.05em}
    .node:focus-visible,.edge:focus-visible{outline:3px solid #8eb7ff;outline-offset:4px}
    .edges{pointer-events:none}
    .edge{pointer-events:stroke;cursor:pointer}
    .edge.selected{stroke:var(--blue);stroke-width:3;opacity:1}
    .architecture-summary{min-height:0;max-height:64%;overflow:auto;scrollbar-gutter:stable}
    .architecture-name{margin-top:10px;font-size:16px;font-weight:700}
    #architecture-details{position:relative;margin-top:10px}
    .detail-close{position:absolute;top:-36px;right:0;width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:#090909;color:#fff;font-size:18px}
    .detail-warning{padding:8px;color:#e4c784;background:#171208;border:1px solid #604c25;border-radius:8px;font-size:11px;line-height:1.4}
    .detail-role{margin:0 30px 12px 0;color:#bbb;font-size:12px;line-height:1.5}
    #architecture-details dl{display:grid;gap:4px;margin:0 0 12px}
    #architecture-details dl div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px}
    #architecture-details dt,#architecture-details dd{margin:0;font-size:11px;line-height:1.45;overflow-wrap:anywhere}
    #architecture-details dt,.detail-group h3,.detail-group p{color:#888}
    .detail-group{padding:10px 0;border-top:1px solid #292929}
    .detail-group h3{margin:0 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
    .detail-group p{margin:0;font-size:11px}
    .detail-group ul{display:grid;gap:5px;padding:0;margin:0;list-style:none}
    .detail-group li{color:#c9c9c9;font-size:11px;line-height:1.45;overflow-wrap:anywhere}
    .rail-disclosure{padding:0}
    .rail-disclosure>summary{display:flex;align-items:center;justify-content:space-between;padding:16px;cursor:pointer;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;list-style:none}
    .rail-disclosure>summary::-webkit-details-marker{display:none}
    .rail-disclosure .agent-list,.rail-disclosure .events{margin:0;padding:0 16px 14px;border-top:1px solid #292929}
    .rail-disclosure.event-section[open]{display:flex;min-height:0;flex-direction:column}
    .rail-disclosure.event-section[open] .events{flex:1;overflow:auto}
    :root{--line:#fff;--muted:#fff;--blue:#fff;--green:#fff;--red:#fff}
    body,.app,.canvas-wrap,.rail{background-color:#000;color:#fff}
    .live-dot{display:none}
    .task-state,.metric,.eyebrow,.node-kind,.node-role,.edge-label,.count,.agent-activity,.event-meta,.detail-role,#architecture-details dt,#architecture-details dd,.detail-group h3,.detail-group p,.detail-group li{color:#fff;fill:#fff}
    .canvas-wrap{background-image:radial-gradient(#ffffff38 1px,transparent 1px)}
    .node,.node:hover,.node[data-container="true"],.node[data-selected="true"]{background:#000;border-color:#fff;box-shadow:none}
    .task-state,.node-status{display:none}
    .node::before,.node[data-status]::before,.node[data-unmapped="true"]::before{border-color:#fff;box-shadow:none}
    .node[data-selected="true"]{box-shadow:0 0 0 3px #fff}
    .node[data-pinned="true"] .node-kind::after{color:#fff}
    .node-toggle,.node-unpin,.detail-close{border-color:#fff;background:#000;color:#fff}
    .node:focus-visible,.edge:focus-visible{outline-color:#fff}
    .edges{z-index:3}
    .edge{stroke:#fff;stroke-width:2;opacity:1}
    .edge.selected{stroke:#fff;stroke-width:4}
    .edge-label{font-size:11px;font-weight:700;paint-order:stroke;stroke:#000;stroke-width:5px;stroke-linejoin:round}
    .architecture-summary{min-height:88px;max-height:64%;padding-bottom:20px;overflow:auto}
    .architecture-name{line-height:1.4}
    .layout-warning,.detail-warning{color:#fff;background:#000;border-color:#fff}
    .detail-group,.rail-disclosure .agent-list,.rail-disclosure .events{border-color:#fff}
    .event-mark{display:none}.event{grid-template-columns:1fr}
    @media(prefers-reduced-motion:no-preference){.node:not(.dragging){transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .16s ease,background .16s ease}}
  </style>
</head>
<body>
  <main class="app" aria-label="Codex Architecture View">
    <header class="topbar"><div class="brand">Codex</div><div class="live-dot" aria-hidden="true"></div><div class="task-name" id="task-name">Connecting to task</div><div class="task-state" id="task-state">Connecting</div></header>
    <nav class="controls" aria-label="Architecture controls"><select class="task-select" id="task-select" aria-label="Codex task"></select><button class="control" id="refresh">Refresh</button><button class="control" id="fit">Fit nodes</button><button class="control" id="arrange">Arrange</button><button class="control" id="reset-layout">Reset layout</button><button class="control" id="zoom-out" aria-label="Zoom out">−</button><button class="control" id="zoom-in" aria-label="Zoom in">+</button><button class="control" id="download-png" disabled>Download nodes PNG</button><button class="control" id="copy-reopen-link">Copy reopen link</button><input id="reopen-link" aria-label="Architecture reopen link" readonly hidden><div class="metrics"><span class="metric" id="node-count">0 nodes</span><span class="metric" id="agent-count">0 agents</span><span class="metric" id="link-count">0 links</span></div></nav>
    <section class="workspace">
      <div class="canvas-wrap"><div class="canvas-head"><div class="eyebrow">Workspace architecture</div><div class="canvas-title">Live progression</div><div class="layout-warning" id="layout-warning" role="status" hidden>The last valid layout is in use. New nodes stay in the Unmapped area.</div></div><div class="canvas" id="canvas"><div id="canvas-size"><div class="node-layer" id="node-layer"><svg class="edges" id="edges"></svg></div></div></div><button class="message-trigger" id="message-trigger">Message your agents</button><section class="dock" id="dock" hidden><div class="dock-head">Message your agents<button class="close" id="close" aria-label="Close message panel">×</button></div><div class="conversation" id="conversation"></div><form class="composer" id="composer"><textarea id="message" aria-label="Guidance for agents" placeholder="Give guidance to this live task"></textarea><button class="send" aria-label="Send message">↑</button></form></section><div class="toast" id="toast" role="status"></div></div>
      <aside class="rail"><section class="section architecture-summary"><div class="section-title">Selected architecture <span class="count" id="revision">r0</span></div><div id="architecture-name" class="architecture-name">Whole system</div><div id="architecture-details"></div></section><details class="section rail-disclosure" id="agents-section" open><summary>Agents <span class="count" id="agent-summary">0 live</span></summary><div class="agent-list" id="agents"></div></details><details class="section rail-disclosure event-section" id="event-section" open><summary>Event stream <span class="count" id="event-count">0</span></summary><div class="events" id="events"></div></details></aside>
    </section>
  </main>
  <script>/*__APP_BUNDLE__*/</script>
</body>
</html>
